# Builds native hea._rs wheels for every platform pip serves, then publishes
# them + the sdist to PyPI. maturin is the build backend (rust/ crate hea-rs),
# so `pip install hea` must find a prebuilt wheel — otherwise pip falls back to
# the sdist and needs a Rust toolchain on the user's machine. The crate is
# abi3-py310, so ONE wheel per (os, arch) covers CPython 3.10+ (no Python
# matrix). Linux uses the manylinux2014 container (glibc 2.17 → broad
# compatibility) + musllinux (Alpine). Run via `workflow_dispatch` for a no-op
# dry run that builds every wheel WITHOUT publishing (the publish job only runs
# on a real release) — do that once before tagging, since release publishing is
# one-shot.
#
# ## Every wheel carries a vendor BLAS, and it is per platform
#
# hea's sparse Cholesky hands its twelve BLAS calls to the platform's best
# backend above `blas::MIN_FLOPS` — worth up to 2.4x the CPU on a large
# factorization. The `blas` feature is ON by default, but it is an *intent*:
# `rust/build.rs` falls back to the portable NEON kernels when no backend can be
# found, so a user's source build cannot fail to link. **A release wheel must
# never take that fallback**, and a wheel that did would pass every test and
# look identical in a green run. So the wheel jobs pass `blas-required`, which
# turns the fallback into a build failure, and then assert
# `build_info()["backend"]` on the built wheel.
#
#   macOS      Accelerate, a system framework. Nothing to install or vendor.
#   Linux      `scipy-openblas32` (a plain DYNAMIC_ARCH OpenBLAS with `scipy_`-
#              prefixed symbols — the binary numpy and scipy already carry).
#              `auditwheel`, which maturin runs for manylinux/musllinux, copies
#              the .so into the wheel and rewrites the rpath.
#   Windows    the same wheel; the DLL is not relocated by maturin, so
#              `delvewheel` does it.
#
# musllinux is the exception and is deliberately NOT `blas-required`:
# scipy-openblas32 publishes no musllinux wheel, so those builds take the
# portable-kernel fallback on purpose. That is a real difference between the
# Alpine wheel and the others, it is why the assertion below is skipped there,
# and it should be revisited if a musl build appears upstream.
name: Publish to PyPI

on:
  # A pull request is a **dry run**: the five build jobs run, `publish` cannot
  # (it requires `github.event_name == 'release'`). Gated on the word `wheels`
  # in the commit message, because four platforms is not something to spend on
  # every push — same switch as `bench` in python-package.yml, and for the same
  # reason `workflow_dispatch` is not enough: its button is read off the default
  # branch, so on a feature branch it is a trigger that does not exist.
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether the four platform builds run. Five seconds, against jobs
  # that are minutes each on four runners.
  #
  # A release or a manual dispatch always builds. A pull request builds only if
  # the head commit's message says `wheels` — the message is not in a
  # `pull_request` payload (that is `push`-only), hence the API call.
  wheels-gate:
    name: "wheels 1/2 — build them?"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — building wheels."
            exit 0
          fi
          msg=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.message)
          echo "head commit ${SHA:0:7}:"
          echo "$msg"
          if printf '%s' "$msg" | grep -qi wheels; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::'wheels' is in the commit message — dry-running all four platform builds. Nothing is published: the publish job requires a release event."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no 'wheels' in the commit message — skipping the wheel builds. Put the word wheels in a commit message to dry-run them."
          fi
  linux:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `blas-required`: fail rather than silently ship the portable
          # kernels — see the header. auditwheel (run by maturin for manylinux)
          # vendors libscipy_openblas into the wheel and rewrites the rpath
          # build.rs emitted, so the wheel needs nothing from the user's system.
          args: --release --out dist --features blas-required
          manylinux: auto          # manylinux2014 container → glibc 2.17
          sccache: "true"
          # Runs INSIDE the container, so the OpenBLAS has to be installed
          # there rather than on the runner — a path from the runner's own
          # site-packages would not exist in the container. `HEA_BLAS_LIB_DIR`
          # is read by rust/build.rs.
          #
          # `export` only, and the belt-and-braces version of this is what broke
          # the first run this job ever had. `$GITHUB_ENV` names a path on the
          # *runner* that is not mounted in the container, so appending to it is
          # not merely useless here — it fails with "No such file or directory",
          # and the action's script runs under `set -e`, so docker exits 1 and
          # the wheel never builds. Hedging between two mechanisms is only free
          # when the wrong one is inert.
          #
          # **`--platform`, because the container is x86_64 whatever the target
          # is.** A plain `pip install` inside it resolves for the *container*,
          # so an aarch64 build got the x86_64 OpenBLAS, `ld.bfd` skipped it as
          # incompatible and reported `cannot find -lscipy_openblas`. pip
          # requires `--target` alongside `--platform`, hence the explicit
          # directory rather than `get_lib_dir()`. Both tags are passed because
          # the wheel carries both and pip matches them literally.
          #
          # `LD_LIBRARY_PATH` is for maturin's *repair* step, not for the
          # compiler, and the two arches need different amounts of help. The
          # link succeeds either way, and then auditwheel has to find the
          # library again to copy it into the wheel: on x86_64 it resolves all
          # three (`libscipy_openblas`, `libgfortran`, `libquadmath`) out of the
          # rpath `build.rs` emitted, but the aarch64 wheel is **cross-built**,
          # so that resolution runs on an ELF the host loader cannot touch and
          # it reported `libscipy_openblas.so => not found` with the rpath sat
          # right there. An explicit search path is what it reads instead.
          before-script-linux: |
            python3 -m pip install --upgrade pip
            python3 -m pip install scipy-openblas32 \
              --no-deps --only-binary=:all: \
              --platform manylinux2014_${{ matrix.target }} \
              --platform manylinux_2_17_${{ matrix.target }} \
              --target /opt/hea-openblas
            export HEA_BLAS_LIB_DIR=/opt/hea-openblas/scipy_openblas32/lib
            export LD_LIBRARY_PATH="$HEA_BLAS_LIB_DIR:${LD_LIBRARY_PATH:-}"
      - name: Assert the wheel carries OpenBLAS
        # A wheel that took the fallback passes every test and is 2.4x more CPU
        # on a large factorization. This is the only place that shows.
        #
        # Native target only: the aarch64 wheel is cross-compiled here and
        # cannot be imported on an x86_64 runner. `blas-required` already
        # covers it at build time — this step is the belt to that's braces, and
        # it is the one that would catch a build.rs that emitted the link flags
        # but not the cfg.
        if: matrix.target == 'x86_64'
        # **Run from outside the checkout.** `python -c` puts the cwd first on
        # `sys.path`, so at the repo root the *source* `hea/` shadows the
        # installed wheel and the import dies on `No module named 'hea._rs'` —
        # which is what happened, and what a local rehearsal missed because a
        # dev checkout has a built `_rs` sitting in it.
        working-directory: ${{ runner.temp }}
        run: |
          # `--no-deps` matters: `--no-index` pins the *wheel* to the one just
          # built, which is the point, but it also blocks hea's own
          # dependencies, and a run of this step died on "No matching
          # distribution found for matplotlib". Deps from the index, artifact
          # from `dist`.
          python -m pip install numpy scipy
          python -m pip install --no-index --no-deps --find-links ${{ github.workspace }}/dist hea
          python -c "
          from hea.sparse import build_info
          i = build_info(); print(i)
          assert i['backend'] == 'openblas', i
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels (musllinux / Alpine)
        # NOT `blas-required`: build.rs takes the portable-kernel fallback here,
        # so the Alpine wheel is the one platform without a vendor BLAS —
        # correct, tested, and slower on large sparse factorizations.
        #
        # **The reason given for that is now out of date.** It read "scipy-
        # openblas32 publishes no musllinux wheel"; as of 2026-08-13 it
        # publishes `musllinux_1_2_x86_64` and `musllinux_1_2_aarch64`, and has
        # since 0.3.31.22.1. So this is now a choice rather than a constraint,
        # and the choice is only still here because turning it on is a change to
        # what Alpine users get and belongs in its own dry run, not bundled into
        # one verifying other fixes.
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  macos:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    # GitHub retired the macos-13 (Intel) runners, so build BOTH mac arches on
    # the Apple-Silicon runner: the macOS toolchain is universal, so x86_64
    # cross-compiles cleanly. The wheel is identical to a native Intel build —
    # `rfma` keys off target_arch, so an x86_64 target gets the plain a*b+c
    # branch regardless of the build host.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # Accelerate is a system framework on both mac arches, so
          # `blas-required` can never fail here and there is nothing to vendor.
          args: --release --out dist --features blas-required
          sccache: "true"
      - name: Assert the wheel carries Accelerate
        # Native arch only — the x86_64 wheel is cross-compiled on this runner.
        if: matrix.target == 'aarch64'
        # **Run from outside the checkout.** `python -c` puts the cwd first on
        # `sys.path`, so at the repo root the *source* `hea/` shadows the
        # installed wheel and the import dies on `No module named 'hea._rs'` —
        # which is what happened, and what a local rehearsal missed because a
        # dev checkout has a built `_rs` sitting in it.
        working-directory: ${{ runner.temp }}
        run: |
          # `--no-deps` matters: `--no-index` pins the *wheel* to the one just
          # built, which is the point, but it also blocks hea's own
          # dependencies, and a run of this step died on "No matching
          # distribution found for matplotlib". Deps from the index, artifact
          # from `dist`.
          python -m pip install numpy scipy
          python -m pip install --no-index --no-deps --find-links ${{ github.workspace }}/dist hea
          python -c "
          from hea.sparse import build_info
          i = build_info(); print(i)
          assert i['backend'] == 'accelerate', i
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: ${{ matrix.target }}
      - name: Install OpenBLAS
        # Runs on the runner itself here, not in a container — maturin-action
        # builds Windows natively.
        run: |
          python -m pip install --upgrade pip delvewheel scipy-openblas32
          python -c "import scipy_openblas32 as s, os; open(os.environ['GITHUB_ENV'],'a').write('HEA_BLAS_LIB_DIR=' + s.get_lib_dir() + '\n')"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features blas-required
          sccache: "true"
      - name: Vendor the OpenBLAS DLL into the wheel
        # build.rs deliberately emits no rpath on Windows (link.exe rejects it)
        # and maturin runs no repair step there, so the wheel would link at
        # build time and fail to load on a machine without scipy_openblas32.
        # delvewheel copies the DLL in and patches the import table — the
        # Windows equivalent of what auditwheel does for us on Linux.
        shell: bash
        run: |
          mkdir -p repaired
          for w in dist/*.whl; do
            delvewheel repair --add-path "$HEA_BLAS_LIB_DIR" -w repaired "$w"
          done
          rm -f dist/*.whl && mv repaired/*.whl dist/
      - name: Assert the wheel carries OpenBLAS and loads without it on PATH
        # Loading is the half that matters here: a wheel whose DLL was not
        # vendored imports fine on THIS machine, because scipy_openblas32 is
        # installed. Uninstall it first so the check is about the wheel.
        #
        # **Run from outside the checkout**, like the other two: `python -c`
        # puts the cwd first on `sys.path`, so at the repo root the source
        # `hea/` shadows the installed wheel and the import dies on
        # `No module named 'hea._rs'`.
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip uninstall -y scipy-openblas32
          # `--no-deps` matters: `--no-index` pins the *wheel* to the one just
          # built, which is the point, but it also blocks hea's own
          # dependencies, and a run of this step died on "No matching
          # distribution found for matplotlib". Deps from the index, artifact
          # from `dist`.
          python -m pip install numpy scipy
          python -m pip install --no-index --no-deps --find-links ${{ github.workspace }}/dist hea
          python -c "
          from hea.sparse import build_info
          i = build_info(); print(i)
          assert i['backend'] == 'openblas', i
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only publish for a real release; workflow_dispatch is a build-only dry run.
    if: github.event_name == 'release'
    needs: [linux, musllinux, macos, windows, sdist]
    permissions:
      id-token: write          # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
