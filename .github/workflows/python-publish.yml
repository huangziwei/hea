# `linux`, `musllinux`, `macos` and `windows` build the hea wheels, `sdist` the
# source archive, and `publish` uploads all of them to PyPI on a `release`.
name: Publish to PyPI

on:
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `wheels-gate` sets `run` to true on `release` and `workflow_dispatch`, and on
  # a `pull_request` whose head commit message contains `wheels`.
  wheels-gate:
    name: "wheels 1/2 — build them?"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — building wheels."
            exit 0
          fi
          msg=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.message)
          echo "head commit ${SHA:0:7}:"
          echo "$msg"
          if printf '%s' "$msg" | grep -qi wheels; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::'wheels' is in the commit message — dry-running all four platform builds. Nothing is published: the publish job requires a release event."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no 'wheels' in the commit message — skipping the wheel builds. Put the word wheels in a commit message to dry-run them."
          fi

  # `blas-required` fails a build that finds no BLAS backend; `build_info()`
  # reports the backend each installed wheel carries.
  linux:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features blas-required
          manylinux: auto
          sccache: "true"
          before-script-linux: |
            python3 -m pip install scipy-openblas32
            HEA_BLAS_LIB_DIR=$(python3 -c 'import scipy_openblas32 as s; print(s.get_lib_dir())')
            export HEA_BLAS_LIB_DIR
      - name: Assert the wheel carries OpenBLAS
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install numpy scipy
          python -m pip install --no-index --no-deps --find-links ${{ github.workspace }}/dist hea
          python -c "
          from hea.sparse import build_info
          i = build_info(); print(i)
          assert i['backend'] == 'openblas', i
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # `musllinux` builds without `blas-required` and runs no `build_info()` assert.
  musllinux:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels (musllinux / Alpine)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  macos:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features blas-required
          sccache: "true"
      - name: Assert the wheel carries Accelerate
        if: matrix.target == 'aarch64'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install numpy scipy
          python -m pip install --no-index --no-deps --find-links ${{ github.workspace }}/dist hea
          python -c "
          from hea.sparse import build_info
          i = build_info(); print(i)
          assert i['backend'] == 'accelerate', i
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: ${{ matrix.target }}
      - name: Install OpenBLAS
        run: |
          python -m pip install --upgrade pip delvewheel scipy-openblas32
          python -c "import scipy_openblas32 as s, os; open(os.environ['GITHUB_ENV'],'a').write('HEA_BLAS_LIB_DIR=' + s.get_lib_dir() + '\n')"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features blas-required
          sccache: "true"
      - name: Vendor the OpenBLAS DLL into the wheel
        shell: bash
        run: |
          mkdir -p repaired
          for w in dist/*.whl; do
            delvewheel repair --add-path "$HEA_BLAS_LIB_DIR" -w repaired "$w"
          done
          rm -f dist/*.whl && mv repaired/*.whl dist/
      - name: Assert the wheel carries OpenBLAS and loads without it on PATH
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip uninstall -y scipy-openblas32
          python -m pip install numpy scipy
          python -m pip install --no-index --no-deps --find-links ${{ github.workspace }}/dist hea
          python -c "
          from hea.sparse import build_info
          i = build_info(); print(i)
          assert i['backend'] == 'openblas', i
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    needs: wheels-gate
    if: needs.wheels-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [linux, musllinux, macos, windows, sdist]
    permissions:
      id-token: write          # pypa/gh-action-pypi-publish authenticates with it
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
