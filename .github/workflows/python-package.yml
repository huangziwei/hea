# Linux matrix: installs Python + Rust, builds the hea._rs extension, and runs the
# suite against the Rust-backed (active) numeric path. The strict bit-exact Rust==R
# gate (tests/test_rs_parity.py) is 0-ulp only on macOS (Apple libm), so it runs in
# the separate macOS job below and skips on Linux (glibc libm floor); the Linux
# matrix exercises the Rust port via the tolerance-pinned R tests.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo build (rust/)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: Install SuiteSparse (CHOLMOD backend)
      # scikit-sparse builds against libsuitesparse-dev. Without it, hea
      # falls back to scipy.sparse.linalg.splu, whose different sparse
      # reduction order opens a wider FP floor on glmer fits — enough
      # to fail the FD-Hessian SE pin on poly() contrasts (~2e-2 abs)
      # and the predict tolerance (~3e-9 abs).
      # (No R here: the Rust==R gate is macOS-only — see the job below — and the
      # translator tests, the only other live-R users, are skipped on Linux.)
      run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[fast]' --group dev
    - name: Build hea._rs (Rust extension) into the source tree
      # build-backend is still hatchling, so `pip install .` ships no Rust.
      # Build the crate with maturin and copy the compiled module into hea/,
      # where pytest's `pythonpath = ["."]` import resolution finds it
      # (mirrors rust/rebuild.sh). abi3-py310 means one build is portable
      # across the whole 3.10–3.14 matrix.
      run: |
        python -m pip install 'maturin==1.14.0'
        maturin build --release --interpreter python -o dist
        whl="$(ls -t dist/hea-*.whl | head -1)"
        python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('dist/extract')" "$whl"
        cp dist/extract/hea/_rs*.so hea/
        ls -l hea/_rs*.so
    - name: Verify the Rust extension is active (no silent fallback)
      # Hard-fail if hea._rs is missing: otherwise the parity tests would
      # importorskip and the suite would quietly green on the numpy path.
      run: python -c "import hea, hea._rs; print('hea:', hea.__file__); print('hea._rs:', hea._rs.__file__)"
    - name: Test with pytest
      # Parallelize across the runner's cores (pytest-xdist). Pin BLAS/OpenMP to
      # one thread per worker so N workers don't oversubscribe the cores — and so
      # each fit uses a single, deterministic reduction order (steadier than
      # multi-threaded BLAS on the FP-sensitive lmer/gam pins). `worksteal`
      # rebalances the few very-long fits (profile/drop1/bootstrap) across idle
      # workers. ~3-4× faster on a 4-core runner.
      env:
        OPENBLAS_NUM_THREADS: "1"
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
      # tests/translate/ exercises the R<->Python translator end-to-end against
      # tidyverse (library(dplyr)/…), which isn't installed here and takes far too
      # long to install in CI. Those run locally where tidyverse is present.
      # tests/test_rs_parity.py skips here (macOS-only gate — see the job below).
      run: pytest -n auto --dist worksteal --ignore=tests/translate

  rs-parity-macos:
    # The strict bit-exact Rust==R gate (tests/test_rs_parity.py). It is 0-ulp
    # only on macOS (Apple libm); on Linux glibc the transcendental kernels drift
    # a few ulp (cross-platform libm floor), so the gate skips on the Linux matrix
    # above and runs here instead. macos-13 is x86_64 (matches the dev machine the
    # gate was verified 0-ulp on).
    name: Rust==R bit-exact gate (macOS)
    runs-on: macos-13
    env:
      RUST_BACKTRACE: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo build (rust/)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: Set up R (Rscript + base stats = all d/p/q)
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
    - name: Install dependencies
      # No [fast]/scikit-sparse — the gate only needs hea + numpy + Rscript.
      run: |
        python -m pip install --upgrade pip
        python -m pip install . --group dev
    - name: Build hea._rs (Rust extension) into the source tree
      run: |
        python -m pip install 'maturin==1.14.0'
        maturin build --release --interpreter python -o dist
        whl="$(ls -t dist/hea-*.whl | head -1)"
        python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('dist/extract')" "$whl"
        cp dist/extract/hea/_rs*.so hea/
        ls -l hea/_rs*.so
    - name: Run the bit-exact Rust==R gate
      run: pytest tests/test_rs_parity.py -q
