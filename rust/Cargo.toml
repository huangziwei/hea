[package]
name = "hea-rs"
version = "0.1.10"
edition = "2021"
description = "Bit-exact, vectorized Rust ports of hea's R-parity numeric kernels"
license = "GPL-3.0-or-later"

[lib]
name = "_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["blas"]
blas = []
blas-required = ["blas"]
blas-openblas = ["blas"]
# Hand the vendor *every* call rather than only those above `blas::MIN_FLOPS`.
# Slower on purpose — the tiny calls pay the vendor's dispatch for nothing — and
# it exists so the `blas` path can be gated for bit-exactness at all: at any
# cutoff above zero `L->x` is a mix of two libraries' rounding and there is
# nothing to compare with `==`. See `blas::MIN_FLOPS`.
blas-all = ["blas"]
# Read the cutoff from `HEA_BLAS_MIN_FLOPS` at first use instead of compiling it
# in. **Never ship this**: it exists so locating the crossing costs one build
# rather than one per column, which is what makes the sweep affordable on a CI
# runner — the only x86-64 hardware this project has. See `blas::MIN_FLOPS`.
blas-sweep = ["blas"]
profiling = []

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module"] }
numpy = "0.23"
rayon = "1"
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
