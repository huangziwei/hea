[package]
name = "hea-rs"
version = "0.1.9"
edition = "2021"
description = "Bit-exact, vectorized Rust ports of hea's R-parity numeric kernels"
license = "GPL-3.0-or-later"

[lib]
name = "_rs"
# cdylib → a Python-loadable shared object; rlib → usable from Rust unit tests.
crate-type = ["cdylib", "rlib"]

# `blas` routes the twelve kernels upstream calls the BLAS for to the platform's
# own — Accelerate on macOS, OpenBLAS elsewhere. **On by default**: it is worth
# 2.4x the CPU on a large factorization, and both libraries are the same ones
# CHOLMOD itself links, so the port gets *closer* to the reference rather than
# further from it. See `sparse::blas`.
#
# The feature is an *intent*, not a guarantee. `build.rs` decides whether a
# backend is actually reachable and emits `cfg(vendor_blas)` only then, so a
# source build on a machine with no OpenBLAS gets the portable NEON kernels
# instead of a link error — and `build_info()["backend"]` is None so it is
# visible rather than silent. Use `blas-required` where the fallback would be a
# defect (CI wheels).
[features]
default = ["blas"]
blas = []
# Refuse to build rather than fall back. What the wheel jobs pass: a release
# wheel that quietly shipped the portable kernels because the container was
# missing OpenBLAS is the exact failure this guards, and it is invisible in a
# green CI run otherwise.
blas-required = ["blas"]
# Force the OpenBLAS arm even on macOS. A preference in its own right, and the
# way the arm that ships to Linux and Windows gets built and run on a machine
# that is neither — see `sparse::blas`.
blas-openblas = ["blas"]
# Hand the vendor *every* call rather than only those above `blas::MIN_FLOPS`.
# Slower on purpose — the tiny calls pay the vendor's dispatch for nothing — and
# it exists so the `blas` path can be gated for bit-exactness at all: at any
# cutoff above zero `L->x` is a mix of two libraries' rounding and there is
# nothing to compare with `==`. See `blas::MIN_FLOPS`.
blas-all = ["blas"]

[dependencies]
# abi3-py310: one wheel works on CPython 3.10+ (matches requires-python).
# extension-module: don't link libpython (symbols resolved by the host interpreter).
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module"] }
numpy = "0.23"
# Data-parallel maps for the element-wise nmath d/p/q kernels and for
# cluster/dist (rayon over independent point-pairs, each pair's column reduction
# kept serial). Used only above a length threshold, under py.allow_threads; the
# per-unit float ops are unchanged so 0-ulp parity holds (parallel == serial
# bit-for-bit; no cross-unit reduction). hclust/kmns are serial — never rayon.
rayon = "1"
# macOS only, and for exactly one call: `sysctlbyname ("hw.perflevel0.
# physicalcpu")`, so the sparse factorization can size its pool to the
# performance cores. See `sparse::super_numeric::numeric_pool`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
# Do NOT add fast-math / `-C target-feature=+fma` / `target-cpu=native`: a
# *blanket* contraction flag fuses expressions the reference leaves un-fused and
# breaks 0-ulp parity with R (re-run tests/test_rs_parity.py if you touch codegen
# flags). This is a ban on the flag, not on fusion: where the reference itself
# fuses, the kernel says so explicitly with `nmath::util::rfma`, per expression —
# which is how it stays a port decision rather than a compiler's. LTO is
# intentionally off — measured to give no speedup here (intra-crate hot path;
# opt-level=3 inlines it).
