[tool.pytest.ini_options]
pythonpath = [".", "tests"]
# The suite is tests/. dev/ is untracked scratch — benchmark harnesses and
# vendored oracle builds (a pinned scikit-sparse sdist among them, which ships
# its own test module) — and collecting it turns a stray checkout into a
# collection error.
testpaths = ["tests"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# --- Rust extension (hea._rs), built from rust/ (crate hea-rs) by maturin -----
# maturin is the build backend: `pip install` / `uv build` / a git dependency on
# this branch compile the Rust crate into the wheel, so source-build downstreams
# get the native `hea._rs` kernels — not just the pure-Python fallback. Building
# from source therefore needs the Rust toolchain; prebuilt wheels (CI, §2.4 of the
# rust-port plan) let end users `pip install` with no Rust. In-session/sandbox
# builds need CARGO_HOME redirected into the workdir (see rust/rebuild.sh).
[tool.maturin]
manifest-path = "rust/Cargo.toml"   # Rust crate (hea-rs) lives in rust/
python-source = "."                  # Python package `hea` stays at repo root
module-name = "hea._rs"              # compiled module installs as hea/_rs

[project]
name = "hea"
version = "0.1.9"
description = "R-style Linear Models with Python"
authors = []
requires-python = ">=3.10.0"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.2",
    "polars==1.41.2",
    "scipy>=1.15.1",
]

license = "GPL-3.0-or-later"
# Explicit so maturin packs LICENSE into the SDIST too (not just the wheel).
# Without it the sdist's METADATA declares `License-File: LICENSE` but omits the
# file, and PyPI's PEP 639 check rejects the upload (400).
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
# The bundled example datasets -- `data("penguins", "palmerpenguins")` and the
# rest of `hea.data`'s rdatasets-sourced corpus. Two packages, and they are one
# feature: `rdatasets` is the source, `pyarrow` is what polars needs to convert
# its pandas frames when a column carries an extension dtype.
#
# 177 MB of the 205 a dependent package would otherwise inherit, and nothing in
# the modeling core touches either: with `pyarrow` genuinely absent (a shadow
# site-packages, not a `sys.meta_path` hook -- those are silently dead on 3.12+)
# the suite is 4567 passed / 4 failed, and all four are `hea.data()` loading
# `palmerpenguins`. Bundled CSV datasets keep working without this.
data = [
    "pyarrow>=24.0.0",
    "rdatasets>=0.2.10",
]
# Retained empty so existing `hea[fast]` pins keep resolving. The sparse
# Cholesky is `hea.sparse` now -- CHOLMOD ported to Rust, in the wheel -- so
# there is nothing optional left to install for it.
fast = []

[dependency-groups]
dev = [
    # The test corpus is the dataset corpus -- `load_dataset` reaches rdatasets
    # for most of it -- so development and CI take the `data` extra even though
    # an install does not.
    "hea[data]",
    # maturin is the build backend (see [build-system]); `uv sync` builds the
    # hea._rs extension in editable mode and the `maturin develop` CLI lives here.
    # CI pins maturin==1.14.0.
    "maturin>=1.14.0",
    "flake8>=7.1.1",
    "pytest>=9.0.3",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0.3",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "ruff>=0.15.13",
    "build",
    "twine",
]

[tool.ruff.lint]
# ``from hea.R import *`` is the intentional ergonomic for the R-flavored
# namespace — see hea/R.py. We commit to NOT using star imports anywhere
# else, so silencing these globally is safe:
#   F403 — flags every ``from X import *`` line.
#   F405 — flags every name that *might* come from a star import (ruff
#          can't statically resolve our ``__all__``).
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# ``__init__.py`` modules deliberately re-export their submodules' public
# names (and a few private helpers used cross-module). Those imports are
# "unused" only within the file itself — F401 here is always an intentional
# re-export, not a mistake. The curated ``__all__`` lists remain the source
# of truth for ``from hea.X import *``.
"**/__init__.py" = ["F401"]
# ``family.py`` is a mechanical port of mgcv's efam.r / coxph.r / mvam.r,
# where single-letter math names (``l`` = log-likelihood / deviance residual,
# loop indices, …) mirror the R/C source verbatim. Renaming them would reduce
# port fidelity, so E741 (ambiguous name) is silenced for this file only — the
# names are deliberate, not mistakes.
"hea/family.py" = ["E741"]

