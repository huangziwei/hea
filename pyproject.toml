[tool.pytest.ini_options]
pythonpath = [".", "tests"]
# Pinned so collection never wanders outside the suite: the repo also carries
# untracked scratch directories that ship test modules of their own.
testpaths = ["tests"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# --- Rust extension (hea._rs), built from rust/ (crate hea-rs) by maturin -----
# maturin is the build backend, so `pip install` / `uv build` / a git dependency
# compile the crate into the wheel and source-build downstreams get the native
# kernels rather than the pure-Python fallback. Building from source therefore
# needs the Rust toolchain; the published wheels do not. A sandboxed build needs
# CARGO_HOME redirected into the workdir — see rust/rebuild.sh.
[tool.maturin]
manifest-path = "rust/Cargo.toml"   # Rust crate (hea-rs) lives in rust/
python-source = "."                  # Python package `hea` stays at repo root
module-name = "hea._rs"              # compiled module installs as hea/_rs

[project]
name = "hea"
version = "0.1.10"
description = "R-style Linear Models with Python"
authors = []
requires-python = ">=3.10.0"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.2",
    # Exact. hea subclasses pl.DataFrame/LazyFrame/Series and holds that
    # subclass across every polars operation by riding two private hooks:
    # `_from_pydf`/`_from_pyldf`/`_from_pyseries`, and `_collect_eager`, the
    # terminal call of polars' eager-via-lazy round-trip. Neither is public
    # API and either can move in any release, so the version is pinned and
    # tests/test_dataframe_subclass.py is the tripwire. Nothing below polars
    # 1.44 works: `_collect_eager` and `Categories.to_series()` are absent.
    "polars==2.0.0rc1",
    "scipy>=1.15.1",
]

license = "GPL-3.0-or-later"
# Required, not decorative: it is what makes maturin pack LICENSE into the
# sdist as well as the wheel. An sdist whose METADATA declares `License-File`
# without shipping the file fails PyPI's PEP 639 check at upload.
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
# The bundled example datasets -- `data("penguins", "palmerpenguins")` and the
# rest of `hea.data`'s rdatasets-sourced corpus. Two packages, one feature:
# `rdatasets` is the source, and `pyarrow` is what polars needs to convert its
# pandas frames when a column carries an extension dtype.
#
# Optional because it is the bulk of the install size and the modeling core
# never touches it. Without the extra, `hea.data()` can still read the bundled
# CSV datasets; only the rdatasets-sourced ones need it.
data = [
    "pyarrow>=24.0.0",
    "rdatasets>=0.2.10",
]
# Empty, and kept so `hea[fast]` pins keep resolving. The sparse Cholesky is
# `hea.sparse`, a Rust port of CHOLMOD shipped in the wheel, so there is
# nothing optional left to install for it.
fast = []

[tool.uv]
# The polars pin is a release candidate (see [project].dependencies) and uv
# will not resolve a pre-release without this. It has to be "allow": the
# narrower "explicit" covers only packages this file names, and polars pulls
# its own `polars-runtime-*` rc transitively. Remove once the pin is final.
prerelease = "allow"

[dependency-groups]
dev = [
    # The test corpus is the dataset corpus -- `load_dataset` reaches rdatasets
    # for most of it -- so development and CI take the `data` extra even though
    # an install does not.
    "hea[data]",
    # maturin is the build backend (see [build-system]); `uv sync` builds the
    # hea._rs extension in editable mode and the `maturin develop` CLI lives here.
    # CI pins maturin==1.14.0.
    "maturin>=1.14.0",
    "pytest>=9.0.3",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0.3",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    # Floor matters: [tool.ruff.lint] carries no `select`, so the rule set is
    # whatever ruff defaults to. An older ruff defaults to far fewer rules and
    # would pass while checking a fraction of what the tree is clean under.
    "ruff>=0.16.1",
    "build",
    "twine",
]

[tool.ruff.lint]
# No `select`: the rule set is ruff's default, and the dev-group floor is what
# pins how large that is. Nothing is silenced project-wide — the few places a
# rule is genuinely wrong here (deliberate blind excepts in the
# matplotlib/polars best-effort paths, `exec` in the translate runners, R's
# local-time `Sys.Date()` semantics, …) carry an inline `# noqa: <CODE>` with
# its reason, so the rule stays live for new code.

[tool.ruff.lint.per-file-ignores]
# ``__init__.py`` modules deliberately re-export their submodules' public
# names (and a few private helpers used cross-module). Those imports are
# "unused" only within the file itself — F401 here is always an intentional
# re-export, not a mistake. The curated ``__all__`` lists remain the source
# of truth for ``from hea.X import *``.
"**/__init__.py" = ["F401"]

