[tool.pytest.ini_options]
pythonpath = [".", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Rust extension (hea._rs), built from rust/ (crate hea-rs) by maturin -----
# NOTE: build-backend stays hatchling during the spike so `uv run` keeps working
# with the pure-Python fallback. The release switch to
# `build-backend = "maturin"` happens once the wheel pipeline is verified
# (plans/rust-port-implementation.md §1.1/§2). `maturin build` reads the config
# below directly regardless of the active PEP 517 backend.
[tool.maturin]
manifest-path = "rust/Cargo.toml"   # Rust crate (hea-rs) lives in rust/
python-source = "."                  # Python package `hea` stays at repo root
module-name = "hea._rs"              # compiled module installs as hea/_rs

[project]
name = "hea"
version = "0.1.5"
description = "Linear Models with Python"
authors = []
requires-python = ">=3.10.0"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.2",
    "polars==1.41.2",
    "pyarrow>=24.0.0",
    "rdatasets>=0.2.10",
    "scipy>=1.15.1",
]

license = "GPL-3.0-or-later"
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
fast = [
    "scikit-sparse>=0.5.0",
]

[dependency-groups]
dev = [
    "flake8>=7.1.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "ruff>=0.15.13",
]

[tool.setuptools]
packages = {find = {}}
include-package-data = true

[tool.ruff.lint]
# ``from hea.R import *`` is the intentional ergonomic for the R-flavored
# namespace — see hea/R.py. We commit to NOT using star imports anywhere
# else, so silencing these globally is safe:
#   F403 — flags every ``from X import *`` line.
#   F405 — flags every name that *might* come from a star import (ruff
#          can't statically resolve our ``__all__``).
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# ``__init__.py`` modules deliberately re-export their submodules' public
# names (and a few private helpers used cross-module). Those imports are
# "unused" only within the file itself — F401 here is always an intentional
# re-export, not a mistake. The curated ``__all__`` lists remain the source
# of truth for ``from hea.X import *``.
"**/__init__.py" = ["F401"]

